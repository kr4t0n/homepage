{{- if and .Values.media.enabled (not .Values.media.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "homepage.mediaClaim" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
  annotations:
    # The files on it are loaded by hand and exist nowhere else in the
    # deployment, so losing them should take a deliberate delete.
    helm.sh/resource-policy: keep
    {{- with .Values.media.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.media.accessMode }}
  resources:
    requests:
      storage: {{ .Values.media.size }}
  {{- with .Values.media.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
