{{- include "homepage.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homepage.labels" . | nindent 8 }}
      {{- $checksum := and .Values.argus.apiKey (not .Values.argus.existingSecret) }}
      {{- if or $checksum .Values.podAnnotations }}
      annotations:
        {{- /*
          Rolls the pods when the generated Secret changes. Without it, a
          `helm upgrade` that only rotates the key updates the Secret and leaves
          the running pods holding the old value. A Secret managed elsewhere is
          not tracked; roll the Deployment yourself after rotating it.
        */}}
        {{- if $checksum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "homepage.image" . }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if or (include "homepage.argusConfigured" .) .Values.extraEnv }}
          env:
            {{- if include "homepage.argusConfigured" . }}
            {{- /* The server appends `/me/pixels`, so a trailing slash would request `//me/pixels`. */}}
            - name: ARGUS
              value: {{ .Values.argus.url | trimSuffix "/" | quote }}
            - name: ARGUS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homepage.secretName" . }}
                  key: {{ include "homepage.secretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.media.enabled }}
          volumeMounts:
            {{- /* Over the build's own static tree, so the existing static handler serves it and dev's public/media maps onto the same URLs. */}}
            - name: media
              mountPath: /app/dist/media
              readOnly: true
          {{- end }}
          {{- if .Values.shutdownDelaySeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.shutdownDelaySeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.media.enabled }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "homepage.mediaClaim" . }}
            readOnly: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
