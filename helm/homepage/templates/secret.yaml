{{- /*
  Rendered only when the key was supplied inline. Pointing at an existingSecret
  means it is managed elsewhere, and generating a second one would leave two
  sources of truth for the same credential.
*/ -}}
{{- if and .Values.argus.apiKey (not .Values.argus.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ARGUS_KEY: {{ .Values.argus.apiKey | quote }}
{{- end }}
