    description: 'kr4t0n''s homepage — an explorable 3D room. One container serves
      the built site and the /api/pixels proxy that lights the two wall boards from
      Argus. An optional volume supplies the backing track at runtime.  Argus is NOT
      required. Without it the room renders normally and the boards stay unlit, which
      is a supported state rather than a failure. '
