name: Image

# Builds the container and pushes it to Docker Hub.
#
# Pull requests build but do not push, so a broken Dockerfile is caught before
# it reaches main rather than after. Everything else publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first image irrelevant, so cancel
# it. Tags are exempt by virtue of having their own ref, and a release build
# should never be cancelled by the next one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Needed for the GitHub Actions cache backend below; the default docker
      # driver cannot export cache.
      - uses: docker/setup-buildx-action@v3

      # Skipped on pull requests, which do not push and so need no credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The repository is <namespace>/homepage, where the namespace is the
      # Docker Hub account. Taken from the same secret used to log in so there is
      # one place to change it; it appears masked in the logs as a result, which
      # is cosmetic.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/homepage
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only. Adding linux/arm64 here works, but it builds under
          # QEMU emulation and `npm ci` plus a Vite build of this scene is slow
          # enough under it to dominate the run. Add it when a cluster node
          # actually needs it.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches the npm ci layer across runs, which is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
