name: Image

# Builds the container and pushes it to Docker Hub.
#
# Pull requests build but do not push, so a broken Dockerfile is caught before
# it reaches main rather than after. Everything else publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first image irrelevant, so cancel
# it. Tags are exempt by virtue of having their own ref, and a release build
# should never be cancelled by the next one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Needed for the GitHub Actions cache backend below; the default docker
      # driver cannot export cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Skipped on pull requests, which do not push and so need no credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The repository is <namespace>/homepage, where the namespace is the
      # Docker Hub account. Taken from the same secret used to log in so there is
      # one place to change it; it appears masked in the logs as a result, which
      # is cosmetic.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/homepage
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # linux/amd64 only. Adding linux/arm64 here works, but it builds under
          # QEMU emulation and `pnpm install` plus a Vite build of this scene is
          # slow enough under it to dominate the run. Add it when a cluster node
          # actually needs it.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches the pnpm install layer across runs, which is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
