name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in package.json's `packageManager`.
      # It goes first so setup-node can find pnpm's store to cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      # The production server is bundled separately from the site, so a break in
      # it would otherwise surface only in the image build.
      - run: pnpm run build:server
      # Contract tests for the /api/pixels proxy against a stubbed upstream.
      # Deliberately needs no credential and no network, so it runs on every
      # pull request including ones from forks, where secrets are unavailable.
      - run: pnpm run verify:proxy

  # helm-publish lints too, but only after merge. A published version is
  # immutable, so a chart that does not render is cheaper to catch here.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - run: helm lint --strict helm/homepage
      - run: helm template ci helm/homepage >/dev/null
      - run: |
          helm template ci helm/homepage \
            --set argus.url=http://argus:4000 --set argus.existingSecret=s \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' >/dev/null
