name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the secret scan sees every commit and not
          # only the tip.
          fetch-depth: 0
      # The same scan the pre-commit hook runs, over every commit rather than
      # only the staged change, so a commit made without the hook is still
      # caught. The release archive is checked against its published sha256
      # before it runs: a version bump has to change both lines together.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$dir/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --verbose --no-banner
      # Installs the pnpm version pinned in package.json's `packageManager`.
      # It goes first so setup-node can find pnpm's store to cache.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      # uv for the Python in tools/. uv has no Dependabot coverage here, so
      # `version` is bumped by hand.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.13
      # Installs Ruff alone: bpy sits in a dependency group that no plain sync
      # includes. --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv run --project tools --locked ruff check tools
      - run: uv run --project tools --locked ruff format --check tools
      - run: pnpm run typecheck
      # Unit tests, the /api/pixels proxy against a stubbed upstream among them.
      # Deliberately needs no credential and no network, so it runs on every
      # pull request including ones from forks, where secrets are unavailable.
      - run: pnpm run test
      - run: pnpm run build
      # The production server is bundled separately from the site, so a break in
      # it would otherwise surface only in the image build.
      - run: pnpm run build:server

  # helm-publish lints too, but only after merge. A published version is
  # immutable, so a chart that does not render is cheaper to catch here.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0
      - run: helm lint --strict helm/homepage
      - run: helm template ci helm/homepage >/dev/null
      - run: |
          helm template ci helm/homepage \
            --set argus.url=http://argus:4000 --set argus.existingSecret=s \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' >/dev/null
