# Hooks that run before every commit. Set up once per clone with
# `pre-commit install`; see README.
#
# 3.2.0 is the floor this config was run on: the secret scan with a fake token,
# and the Ruff hooks over tools/. No hook below asks for a higher one.
minimum_pre_commit_version: '3.2.0'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Calls the gitleaks already on PATH rather than building one with Go,
      # so the version is whatever the machine installed, and README lists it as
      # a prerequisite. CI's scan pins its own copy by checksum.
      - id: gitleaks-system
        # Upstream's manifest leaves this out for the system hook. pre-commit
        # then appends the staged file names, and `gitleaks git` refuses more
        # than one argument, so every commit would fail.
        pass_filenames: false

  # The same Ruff as tools/pyproject.toml pins: bump this rev and that pin
  # together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
    hooks:
      # Scoped to tools/, the only Python here and what CI checks. Unscoped,
      # ruff-format also takes Markdown and would rewrite the Python examples
      # in README.md.
      - id: ruff-check
        args: [--fix]
        files: ^tools/
      - id: ruff-format
        files: ^tools/
