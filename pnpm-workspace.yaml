# pnpm runs no dependency's install scripts unless it is listed here.
allowBuilds:
  # Its postinstall checks the platform binary and fetches it if missing.
  esbuild: true

# Patched floors for advisories in transitive dependencies, all dev-only. Each
# selector keeps the major line its dependents ask for, so no package receives a
# major it was not written against.
overrides:
  # Bound recursion and rewrite work in brace expansion. minimatch 3, 9 and 10
  # pull in three different majors, and each has its own patched release.
  # https://github.com/advisories/GHSA-6j4f-fj2g-mc7p
  # https://github.com/advisories/GHSA-qhr7-859c-m2p7
  # https://github.com/advisories/GHSA-q2hr-2g5m-vwhr
  'brace-expansion@1': ^1.1.21
  'brace-expansion@2': ^2.1.7
  'brace-expansion@5': ^5.0.12
  # Bound indexed source-map offsets in PostCSS and Tailwind's source maps.
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  source-map-js: ^1.2.2
